# This workflow builds and releases the HIPI Panel 7 project for the Raspberry Pi Pico 2 on tag push.
# It can also be started manually from the GitHub Actions tab ("Build HIPI Panel 7" -> Run workflow),
# which is useful for building a tag that was pushed before this workflow existed (e.g. v1.0.0).
# When running manually, the tag must already exist in the repository and must match exactly;
# the build checks out the source at that tag's commit.
# GITHUB_TOKEN is supplied automatically for release creation. Private submodules require a PAT
# with 'contents' permissions, referenced via secrets (e.g. ${{ secrets.PAT }}).

name: Build HIPI Panel 7

on:
  push:
    tags:
      - 'v*'  # Automatic: build and release whenever a v* tag is pushed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write  # required to create GitHub Releases

jobs:
  build:
    name: Build HIPI Panel 7
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}  # manually entered tag, or the name of the pushed tag

    steps:
      # 1. Check out HIPI (without submodules)
      - name: Check out HIPI (without submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: false
          fetch-depth: 0
        # The repo is checked out without submodules first so actions/checkout cannot fail on submodule complications.
        # fetch-depth 0 gives full history for tag refs and diagnostics.

      # 2. Validate tag exists
      - name: Validate tag exists
        run: |
          if ! git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Error: Tag '${RELEASE_TAG}' does not exist."
            echo "Available tags:"
            git tag -l || true
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        # A manual run with a non-existent tag would otherwise fail later with a cryptic "fatal: reference is not a tree".

      # 3. Diagnostics - submodule status
      - name: Diagnostics - submodule status
        if: always()
        run: |
          echo "=== .gitmodules ==="
          cat .gitmodules || echo "(No .gitmodules file found)"
          echo ""
          echo "=== submodule status ==="
          git submodule status || echo "(submodule status command failed)"
          echo ""
          echo "=== submodule remote URLs ==="
          git config --file .gitmodules --get-regexp '^submodule\..*\.url$' | while read -r key url; do
            echo "$key => $url"
          done

      # 4. Fix submodule URLs and initialize submodules
      - name: Fix submodule URLs and initialize submodules
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.url$' | while read -r key url; do
            new_url="$url"
            if echo "$new_url" | grep -q 'git@github\.com:'; then
              new_url="${new_url//git@github.com:/https://github.com/}"
              echo "Rewrote $key: $url => $new_url"
              git config --file .gitmodules --replace-all "$key" "$new_url"
            fi
            if echo "$new_url" | grep -q 'git://'; then
              new_url="${new_url//git:\/\/https:}"
              echo "Rewrote $key: $url => $new_url"
              git config --file .gitmodules --replace-all "$key" "$new_url"
            fi
          done
          git submodule sync --recursive
          git submodule update --init --recursive
        # This isolates the failure so it is clear whether a particular URL form causes the problem.

      # 5. Check out pico-sdk (v2.2.0)
      - name: Check out pico-sdk (v2.2.0)
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive
        # The SDK is a large clone whose submodules hold hardware support needed by the build.

      # 6. Configure CMake
      - name: Configure CMake
        run: |
          export PICO_SDK_PATH="${{ github.workspace }}/pico-sdk"
          rm -rf build
          cmake \
            -DPICO_BOARD=pico2 \
            -DHIPI_BUILD_PANELS=7 \
            -B build

      # 7. Build HIPI Panel 7
      - name: Build HIPI Panel 7
        run: cmake --build build --parallel

      # 8. List build output
      - name: List build output
        run: find build -type f \( -name '*.uf2' -o -name '*.elf' -o -name '*.bin' -o -name '*.hex' -o -name '*.map' \)

      # 9. Prepare release files
      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/hipi_7_pico.uf2 release/hipi_7_pico-${RELEASE_TAG}.uf2
          cp build/hipi_7_pico.elf release/hipi_7_pico-${RELEASE_TAG}.elf
          ls -lh release/
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      # 10. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "HIPI Panel 7 - ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: |
            release/hipi_7_pico-${{ env.RELEASE_TAG }}.uf2
            release/hipi_7_pico-${{ env.RELEASE_TAG }}.elf
