name: Build and Release HIPI

on:
  # Automatically build when a version tag is pushed.
  push:
    tags:
      - 'v*'

  # Also allow an existing tag to be built manually.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build HIPI Panel 7
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # Checkout HIPI, including PicoLed and any other git submodules.
      # ----------------------------------------------------------------
      - name: Checkout HIPI
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      # ----------------------------------------------------------------
      # Checkout the exact Pico SDK version used by the project.
      # CMakeLists.txt specifies SDK 2.2.0.
      # ----------------------------------------------------------------
      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive

      # ----------------------------------------------------------------
      # Configure
      # ----------------------------------------------------------------
      - name: Configure CMake
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          rm -rf build

          cmake \
            -DPICO_BOARD=pico2 \
            -DHIPI_BUILD_PANELS=7 \
            -B build

      # ----------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------
      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake --build build --parallel

      # ----------------------------------------------------------------
      # Show generated files
      # ----------------------------------------------------------------
      - name: List build output
        run: |
          echo "Build directory:"
          find build -maxdepth 2 -type f \
            \( -name '*.uf2' -o -name '*.elf' -o -name '*.bin' -o -name '*.hex' -o -name '*.map' \) \
            -print

      # ----------------------------------------------------------------
      # Give the UF2 a versioned filename.
      # ----------------------------------------------------------------
      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release

          cp build/hipi_7_pico.uf2 \
             "release/hipi_7_pico-${RELEASE_TAG}.uf2"

          cp build/hipi_7_pico.elf \
             "release/hipi_7_pico-${RELEASE_TAG}.elf"

          echo "Release files:"
          ls -lh release/

      # ----------------------------------------------------------------
      # Create/update the GitHub Release and upload the files.
      # ----------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/hipi_7_pico-${{ inputs.tag || github.ref_name }}.uf2
            release/hipi_7_pico-${{ inputs.tag || github.ref_name }}.elf
